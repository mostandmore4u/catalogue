sonar.projectKey=roboshop-catalogue
sonar.projectName=roboshop-catalogue
sonar.sources=.
# Do not analyse dependencies or files generated by the test run
sonar.exclusions=node_modules/**,coverage/**,junit.xml

sonar.tests=test
sonar.test.inclusions=test/**/*.test.js
# Test files should not count towards coverage
sonar.coverage.exclusions=test/**

# Coverage report generated by Jest (lcov format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

